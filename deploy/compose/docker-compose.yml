version: "3.9"

services:
  api:
    build:
      context: ../../
      dockerfile: deploy/compose/Dockerfile
    env_file: ["../../.env.dev"]
    environment:
      DATABASE_URL: postgresql+psycopg://omni:omni@postgres:5432/omni_dev
      REDIS_URL: redis://redis:6379/0
      OMNI_CONTAINER_ROLE: api
      BUNDLED_MEDIA_DIR: /app/backend/storage
      MEDIA_DIR: /data/uploads
      OPENVOICE_ENABLED: ${OPENVOICE_ENABLED:-true}
      OPENVOICE_REPO_DIR: ${OPENVOICE_REPO_DIR:-/opt/openvoice/repo}
      OPENVOICE_CHECKPOINTS_DIR: ${OPENVOICE_CHECKPOINTS_DIR:-/opt/openvoice/checkpoints_v2}
      OPENVOICE_DEVICE: ${OPENVOICE_DEVICE:-auto}
      VOICE_MODELS_DIR: ${VOICE_MODELS_DIR:-/data/uploads/voice_models}
      XTTS_ENABLED: ${XTTS_ENABLED:-true}
      XTTS_MODEL_DIR: ${XTTS_MODEL_DIR:-/data/uploads/voice_models}
      XTTS_DEVICE: ${XTTS_DEVICE:-auto}
      XTTS_WORKER_CACHE_ENABLED: ${XTTS_WORKER_CACHE_ENABLED:-true}
      XTTS_WORKER_CACHE_MAX_ENTRIES: ${XTTS_WORKER_CACHE_MAX_ENTRIES:-2}
      XTTS_TORCH_INFERENCE_MODE_ENABLED: ${XTTS_TORCH_INFERENCE_MODE_ENABLED:-true}
      XTTS_CPU_NUM_THREADS: ${XTTS_CPU_NUM_THREADS:-4}
      XTTS_CPU_INTEROP_THREADS: ${XTTS_CPU_INTEROP_THREADS:-1}
      XTTS_PREVIEW_SPLIT_SENTENCES_OVERRIDE: ${XTTS_PREVIEW_SPLIT_SENTENCES_OVERRIDE:-}
      RENDER_PROFILING_ENABLED: ${RENDER_PROFILING_ENABLED:-true}
      RENDER_PREVIEW_WIDTH: ${RENDER_PREVIEW_WIDTH:-1080}
      RENDER_PREVIEW_HEIGHT: ${RENDER_PREVIEW_HEIGHT:-1920}
      RENDER_PREVIEW_FPS_CAP: ${RENDER_PREVIEW_FPS_CAP:-24}
      RENDER_EXPORT_WIDTH: ${RENDER_EXPORT_WIDTH:-1080}
      RENDER_EXPORT_HEIGHT: ${RENDER_EXPORT_HEIGHT:-1920}
      RENDER_EXPORT_FPS_CAP: ${RENDER_EXPORT_FPS_CAP:-30}
      RENDER_FFMPEG_THREAD_CAP: ${RENDER_FFMPEG_THREAD_CAP:-8}
      RENDER_PREVIEW_ENCODE_PRESET: ${RENDER_PREVIEW_ENCODE_PRESET:-veryfast}
      RENDER_PREVIEW_CRF: ${RENDER_PREVIEW_CRF:-24}
      RENDER_EXPORT_ENCODE_PRESET: ${RENDER_EXPORT_ENCODE_PRESET:-faster}
      RENDER_EXPORT_CRF: ${RENDER_EXPORT_CRF:-22}
      RVC_ENABLED: ${RVC_ENABLED:-false}
      RVC_MODELS_DIR: ${RVC_MODELS_DIR:-/data/uploads/voice_models}
      RVC_RMVPE_PATH: ${RVC_RMVPE_PATH:-}
      RVC_INFER_COMMAND: ${RVC_INFER_COMMAND:-}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-240}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.7}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../backend/storage:/app/backend/storage:ro
      - api_uploads:/data/uploads
      - ../../backend/storage/voice_models:/data/uploads/voice_models
      - ../../vendor/OpenVoice:/opt/openvoice/repo:ro
      - ../../vendor/OpenVoice/checkpoints_v2:/opt/openvoice/checkpoints_v2:ro

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ../../
      dockerfile: deploy/compose/Dockerfile
    env_file: ["../../.env.dev"]
    environment:
      DATABASE_URL: postgresql+psycopg://omni:omni@postgres:5432/omni_dev
      REDIS_URL: redis://redis:6379/0
      OMNI_CONTAINER_ROLE: generation_worker
      BUNDLED_MEDIA_DIR: /app/backend/storage
      MEDIA_DIR: /data/uploads
      OPENVOICE_ENABLED: ${OPENVOICE_ENABLED:-true}
      OPENVOICE_REPO_DIR: ${OPENVOICE_REPO_DIR:-/opt/openvoice/repo}
      OPENVOICE_CHECKPOINTS_DIR: ${OPENVOICE_CHECKPOINTS_DIR:-/opt/openvoice/checkpoints_v2}
      OPENVOICE_DEVICE: ${OPENVOICE_DEVICE:-auto}
      VOICE_MODELS_DIR: ${VOICE_MODELS_DIR:-/data/uploads/voice_models}
      XTTS_ENABLED: ${XTTS_ENABLED:-true}
      XTTS_MODEL_DIR: ${XTTS_MODEL_DIR:-/data/uploads/voice_models}
      XTTS_DEVICE: ${XTTS_DEVICE:-auto}
      XTTS_WORKER_CACHE_ENABLED: ${XTTS_WORKER_CACHE_ENABLED:-true}
      XTTS_WORKER_CACHE_MAX_ENTRIES: ${XTTS_WORKER_CACHE_MAX_ENTRIES:-2}
      XTTS_TORCH_INFERENCE_MODE_ENABLED: ${XTTS_TORCH_INFERENCE_MODE_ENABLED:-true}
      XTTS_CPU_NUM_THREADS: ${XTTS_CPU_NUM_THREADS:-4}
      XTTS_CPU_INTEROP_THREADS: ${XTTS_CPU_INTEROP_THREADS:-1}
      XTTS_PREVIEW_SPLIT_SENTENCES_OVERRIDE: ${XTTS_PREVIEW_SPLIT_SENTENCES_OVERRIDE:-}
      RENDER_PROFILING_ENABLED: ${RENDER_PROFILING_ENABLED:-true}
      RENDER_PREVIEW_WIDTH: ${RENDER_PREVIEW_WIDTH:-1080}
      RENDER_PREVIEW_HEIGHT: ${RENDER_PREVIEW_HEIGHT:-1920}
      RENDER_PREVIEW_FPS_CAP: ${RENDER_PREVIEW_FPS_CAP:-24}
      RENDER_EXPORT_WIDTH: ${RENDER_EXPORT_WIDTH:-1080}
      RENDER_EXPORT_HEIGHT: ${RENDER_EXPORT_HEIGHT:-1920}
      RENDER_EXPORT_FPS_CAP: ${RENDER_EXPORT_FPS_CAP:-30}
      RENDER_FFMPEG_THREAD_CAP: ${RENDER_FFMPEG_THREAD_CAP:-8}
      RENDER_PREVIEW_ENCODE_PRESET: ${RENDER_PREVIEW_ENCODE_PRESET:-veryfast}
      RENDER_PREVIEW_CRF: ${RENDER_PREVIEW_CRF:-24}
      RENDER_EXPORT_ENCODE_PRESET: ${RENDER_EXPORT_ENCODE_PRESET:-faster}
      RENDER_EXPORT_CRF: ${RENDER_EXPORT_CRF:-22}
      CELERY_GENERATION_CONCURRENCY: ${CELERY_GENERATION_CONCURRENCY:-1}
      RVC_ENABLED: ${RVC_ENABLED:-false}
      RVC_MODELS_DIR: ${RVC_MODELS_DIR:-/data/uploads/voice_models}
      RVC_RMVPE_PATH: ${RVC_RMVPE_PATH:-}
      RVC_INFER_COMMAND: ${RVC_INFER_COMMAND:-}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-240}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.7}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "celery -A app.celery_app.celery worker -Q generation,publish --concurrency=${CELERY_GENERATION_CONCURRENCY:-1}"]
    volumes:
      - ../../backend/storage:/app/backend/storage:ro
      - api_uploads:/data/uploads
      - ../../backend/storage/voice_models:/data/uploads/voice_models
      - ../../vendor/OpenVoice:/opt/openvoice/repo:ro
      - ../../vendor/OpenVoice/checkpoints_v2:/opt/openvoice/checkpoints_v2:ro

  voice_worker:
    build:
      context: ../../
      dockerfile: deploy/compose/Dockerfile
    env_file: ["../../.env.dev"]
    environment:
      DATABASE_URL: postgresql+psycopg://omni:omni@postgres:5432/omni_dev
      REDIS_URL: redis://redis:6379/0
      OMNI_CONTAINER_ROLE: voice_worker
      BUNDLED_MEDIA_DIR: /app/backend/storage
      MEDIA_DIR: /data/uploads
      OPENVOICE_ENABLED: ${OPENVOICE_ENABLED:-true}
      OPENVOICE_REPO_DIR: ${OPENVOICE_REPO_DIR:-/opt/openvoice/repo}
      OPENVOICE_CHECKPOINTS_DIR: ${OPENVOICE_CHECKPOINTS_DIR:-/opt/openvoice/checkpoints_v2}
      OPENVOICE_DEVICE: ${OPENVOICE_DEVICE:-auto}
      VOICE_MODELS_DIR: ${VOICE_MODELS_DIR:-/data/uploads/voice_models}
      XTTS_ENABLED: ${XTTS_ENABLED:-true}
      XTTS_MODEL_DIR: ${XTTS_MODEL_DIR:-/data/uploads/voice_models}
      XTTS_DEVICE: ${XTTS_DEVICE:-auto}
      XTTS_WORKER_CACHE_ENABLED: ${XTTS_WORKER_CACHE_ENABLED:-true}
      XTTS_WORKER_CACHE_MAX_ENTRIES: ${XTTS_WORKER_CACHE_MAX_ENTRIES:-2}
      XTTS_TORCH_INFERENCE_MODE_ENABLED: ${XTTS_TORCH_INFERENCE_MODE_ENABLED:-true}
      XTTS_CPU_NUM_THREADS: ${XTTS_CPU_NUM_THREADS:-4}
      XTTS_CPU_INTEROP_THREADS: ${XTTS_CPU_INTEROP_THREADS:-1}
      XTTS_PREVIEW_SPLIT_SENTENCES_OVERRIDE: ${XTTS_PREVIEW_SPLIT_SENTENCES_OVERRIDE:-}
      RVC_ENABLED: ${RVC_ENABLED:-false}
      RVC_MODELS_DIR: ${RVC_MODELS_DIR:-/data/uploads/voice_models}
      RVC_RMVPE_PATH: ${RVC_RMVPE_PATH:-}
      RVC_INFER_COMMAND: ${RVC_INFER_COMMAND:-}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "celery -A app.celery_app.celery worker -Q voice_preview --concurrency=1 --max-tasks-per-child=${CELERY_VOICE_MAX_TASKS_PER_CHILD:-1}"]
    volumes:
      - ../../backend/storage:/app/backend/storage:ro
      - api_uploads:/data/uploads
      - ../../backend/storage/voice_models:/data/uploads/voice_models
      - ../../vendor/OpenVoice:/opt/openvoice/repo:ro
      - ../../vendor/OpenVoice/checkpoints_v2:/opt/openvoice/checkpoints_v2:ro

  beat:
    build:
      context: ../../
      dockerfile: deploy/compose/Dockerfile
    env_file: ["../../.env.dev"]
    environment:
      DATABASE_URL: postgresql+psycopg://omni:omni@postgres:5432/omni_dev
      REDIS_URL: redis://redis:6379/0
      BUNDLED_MEDIA_DIR: /app/backend/storage
      MEDIA_DIR: /data/uploads
      OPENVOICE_ENABLED: ${OPENVOICE_ENABLED:-true}
      OPENVOICE_REPO_DIR: ${OPENVOICE_REPO_DIR:-/opt/openvoice/repo}
      OPENVOICE_CHECKPOINTS_DIR: ${OPENVOICE_CHECKPOINTS_DIR:-/opt/openvoice/checkpoints_v2}
      OPENVOICE_DEVICE: ${OPENVOICE_DEVICE:-auto}
      VOICE_MODELS_DIR: ${VOICE_MODELS_DIR:-/data/uploads/voice_models}
      XTTS_ENABLED: ${XTTS_ENABLED:-true}
      XTTS_MODEL_DIR: ${XTTS_MODEL_DIR:-/data/uploads/voice_models}
      XTTS_DEVICE: ${XTTS_DEVICE:-auto}
      XTTS_WORKER_CACHE_ENABLED: ${XTTS_WORKER_CACHE_ENABLED:-true}
      XTTS_WORKER_CACHE_MAX_ENTRIES: ${XTTS_WORKER_CACHE_MAX_ENTRIES:-2}
      XTTS_TORCH_INFERENCE_MODE_ENABLED: ${XTTS_TORCH_INFERENCE_MODE_ENABLED:-true}
      XTTS_CPU_NUM_THREADS: ${XTTS_CPU_NUM_THREADS:-4}
      XTTS_CPU_INTEROP_THREADS: ${XTTS_CPU_INTEROP_THREADS:-1}
      XTTS_PREVIEW_SPLIT_SENTENCES_OVERRIDE: ${XTTS_PREVIEW_SPLIT_SENTENCES_OVERRIDE:-}
      RVC_ENABLED: ${RVC_ENABLED:-false}
      RVC_MODELS_DIR: ${RVC_MODELS_DIR:-/data/uploads/voice_models}
      RVC_RMVPE_PATH: ${RVC_RMVPE_PATH:-}
      RVC_INFER_COMMAND: ${RVC_INFER_COMMAND:-}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_app.celery", "beat"]
    volumes:
      - ../../backend/storage:/app/backend/storage:ro
      - api_uploads:/data/uploads
      - ../../backend/storage/voice_models:/data/uploads/voice_models
      - ../../vendor/OpenVoice:/opt/openvoice/repo:ro
      - ../../vendor/OpenVoice/checkpoints_v2:/opt/openvoice/checkpoints_v2:ro

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
      POSTGRES_DB: omni_dev
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omni_dev"]
      interval: 10s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pg_data: {}
  api_uploads: {}
  ollama_data: {}
